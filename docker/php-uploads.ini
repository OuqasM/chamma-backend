; Upload limits for admin image uploads (products, categories, brands).
;
; The API validates uploads at max:4096 (4 MB), but the stock image leaves
; upload_max_filesize at 2M, so a perfectly valid 3 MB photo is rejected by
; PHP before Laravel ever sees it. post_max_size has to stay above
; upload_max_filesize to leave room for the multipart envelope.
;
; Must stay at or above nginx's client_max_body_size in frontend/nginx.conf,
; otherwise whichever limit is smaller answers first.

upload_max_filesize = 12M
post_max_size = 16M
